<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>货币乘数计算器</title>
    <style>
        body { font-family: Arial; margin: 40px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; }
        #result { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>货币乘数计算器</h2>
        <label>法定准备金率 (rr):</label>
        <input type="number" id="rr" step="0.01" value="0.1">
        <label>超额准备金率 (er):</label>
        <input type="number" id="er" step="0.01" value="0.05">
        <label>现金漏损率 (c):</label>
        <input type="number" id="c" step="0.01" value="0.08">
        <button onclick="calculate()">计算货币乘数</button>
        <p id="result"></p>
    </div>
    <script>
        function calculate() {
            let rr = parseFloat(document.getElementById('rr').value) || 0;
            let er = parseFloat(document.getElementById('er').value) || 0;
            let c = parseFloat(document.getElementById('c').value) || 0;
            let m = (1 + c) / (rr + er + c);
            document.getElementById('result').innerText = "货币乘数 m = " + m.toFixed(4);
        }
    </script>
</body>
</html>
